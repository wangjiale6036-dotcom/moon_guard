name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js, native]
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Toolchain version
        run: moon version --all
      - name: Check formatting
        run: moon fmt --check
      - name: Typecheck
        run: moon check --deny-warn --target ${{ matrix.target }}
      - name: Test
        run: moon test --deny-warn --target ${{ matrix.target }}
      - name: Build
        run: moon build --target ${{ matrix.target }}
